# Antenne — full stack for Dokploy (compose deploy).
# All services join the shared external `dokploy-network` instead of a
# per-stack network: the server's Docker address pool is exhausted, and
# Traefik (on dokploy-network) needs to reach the client to route the domain.
# Service names are prefixed to avoid DNS collisions on the shared network.
services:
  antenne-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antenne
      POSTGRES_PASSWORD: ${DB_PASSWORD:-antenne}
      POSTGRES_DB: antenne
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped

  antenne-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://antenne:${DB_PASSWORD:-antenne}@antenne-db:5432/antenne?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      STORAGE_DIR: /data/tracks
      STREAM_DIR: /data/stream
      # Continuous MP3 broadcast (ICY/Icecast-style) for external players.
      MP3_STREAM_ENABLED: ${MP3_STREAM_ENABLED:-true}
      MP3_BITRATE_K: ${MP3_BITRATE_K:-128}
      ICY_METAINT: ${ICY_METAINT:-16000}
      STATION_NAME: ${STATION_NAME:-Antenne}
      STATION_GENRE: ${STATION_GENRE:-Various}
      STATION_URL: ${STATION_URL:-}
      STATION_DESCRIPTION: ${STATION_DESCRIPTION:-}
      STATION_PUBLIC: ${STATION_PUBLIC:-false}
    volumes:
      - media-data:/data
    depends_on:
      - antenne-db
    networks:
      - dokploy-network
    restart: unless-stopped

  antenne-client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    environment:
      PORT: 3000
    depends_on:
      - antenne-api
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  db-data:
  media-data:

networks:
  dokploy-network:
    external: true
  # Dokploy appends `- default` to every service that has a domain. The server's
  # Docker address pool is exhausted, so alias the default network onto the
  # already-allocated dokploy-network instead of letting Compose create a new one.
  default:
    external: true
    name: dokploy-network
