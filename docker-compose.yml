# Antenne — full stack for Dokploy (compose deploy).
# All services join the shared external `dokploy-network` instead of a
# per-stack network: the server's Docker address pool is exhausted, and
# Traefik (on dokploy-network) needs to reach the client to route the domain.
# Service names are prefixed to avoid DNS collisions on the shared network.
services:
  antenne-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antenne
      # Strongly recommended: set DB_PASSWORD to a strong value. It is only applied
      # when the volume is first initialised — set it before the first deploy
      # (changing it later requires recreating the db-data volume). The DB is not
      # published to the host; it is only reachable on the internal network.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-antenne}
      POSTGRES_DB: antenne
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped

  antenne-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Production mode: the API refuses to boot on default/weak secrets or a
      # wildcard CORS origin (see config.Validate).
      ANTENNE_ENV: ${ANTENNE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgres://antenne:${DB_PASSWORD:-antenne}@antenne-db:5432/antenne?sslmode=disable
      # Required — compose refuses to start until these are set. Generate the
      # secret with e.g. `openssl rand -hex 32`.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong random value (openssl rand -hex 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a strong password}
      # Explicit public origin, e.g. https://radio.example.com — no wildcard in prod.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN to your public site origin}
      # Optional: CIDRs/IPs of trusted reverse proxies. Empty = loopback + private
      # ranges (Traefik on the shared Docker network is covered by default).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      STORAGE_DIR: /data/tracks
      STREAM_DIR: /data/stream
      # Continuous MP3 broadcast (ICY/Icecast-style) for external players.
      MP3_STREAM_ENABLED: ${MP3_STREAM_ENABLED:-true}
      MP3_BITRATE_K: ${MP3_BITRATE_K:-128}
      ICY_METAINT: ${ICY_METAINT:-16000}
      STATION_NAME: ${STATION_NAME:-Antenne}
      STATION_GENRE: ${STATION_GENRE:-Various}
      STATION_URL: ${STATION_URL:-}
      STATION_DESCRIPTION: ${STATION_DESCRIPTION:-}
      STATION_PUBLIC: ${STATION_PUBLIC:-false}
    volumes:
      - media-data:/data
    depends_on:
      - antenne-db
    networks:
      - dokploy-network
    restart: unless-stopped

  antenne-client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    environment:
      PORT: 3000
    depends_on:
      - antenne-api
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  db-data:
  media-data:

networks:
  dokploy-network:
    external: true
  # Dokploy appends `- default` to every service that has a domain. The server's
  # Docker address pool is exhausted, so alias the default network onto the
  # already-allocated dokploy-network instead of letting Compose create a new one.
  default:
    external: true
    name: dokploy-network
